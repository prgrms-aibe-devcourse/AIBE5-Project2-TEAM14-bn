version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: comic-mysql
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # mount the GCD dump so it will be executed during initialization
      - ./comic-data/2026-03-01.sql:/docker-entrypoint-initdb.d/2026-03-01.sql:ro
    command: [
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_unicode_ci",
      "--sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION"
    ]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: comic-phpmyadmin
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: ${PMA_USER}
      PMA_PASSWORD: ${PMA_PASSWORD}

  # optional Adminer service
  adminer:
    image: adminer:latest
    container_name: comic-adminer
    depends_on:
      - mysql
    ports:
      - "8081:8080"

volumes:
  db_data:
    name: comic_db_data
