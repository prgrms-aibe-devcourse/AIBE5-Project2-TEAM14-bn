spring.application.name=matching-platform

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/matching_platform?serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# MyBatis
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.team12.matchingplatform

# AI Integration
ai.endpoint=${AI_ENDPOINT:}
ai.api-key=${AI_API_KEY:}

# Logging
logging.level.com.team12=DEBUG
